<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>See Yourself in 2030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080d; --bg2:#0d0d16;
  --ink:#eef0f6; --ink-dim:#9aa0b4;
  --glass:rgba(255,255,255,0.055); --glass-b:rgba(255,255,255,0.11);
  --violet:#8b7bff; --cyan:#3fd8e0; --amber:#ffb454;
  --radius:18px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:
    radial-gradient(circle at 15% -10%, rgba(139,123,255,0.18), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(63,216,224,0.12), transparent 40%),
    var(--bg);
  color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100%;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
.wrap{max-width:920px; margin:0 auto; padding:0 20px;}
.top{display:flex; align-items:center; justify-content:space-between; padding:20px 0;}
.brand{display:flex; align-items:center; gap:10px; font-weight:600; letter-spacing:.2px;}
.brand .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--cyan)); box-shadow:0 0 14px var(--violet);}
.hero{text-align:center; padding:48px 0 30px;}
.hero h1{font-size:clamp(2.1rem,6vw,3.4rem); line-height:1.06; margin:0 0 14px; font-weight:600;
  background:linear-gradient(120deg,#fff 30%,var(--cyan) 75%,var(--violet));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
.hero p{color:var(--ink-dim); font-size:1.05rem; max-width:480px; margin:0 auto;}
.card{background:var(--glass); border:1px solid var(--glass-b); border-radius:var(--radius);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 20px 60px -30px rgba(0,0,0,0.6);}
.panel{padding:26px; margin-bottom:22px;}
.btn{border:none; cursor:pointer; font-family:inherit; font-weight:600; font-size:.98rem;
  border-radius:14px; padding:15px 22px; display:inline-flex; align-items:center; justify-content:center; gap:10px;
  transition:transform .15s ease, box-shadow .15s ease; -webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(120deg,var(--violet),var(--cyan)); color:#0a0a12; box-shadow:0 10px 30px -12px rgba(139,123,255,0.6);}
.btn-primary:hover{box-shadow:0 14px 34px -10px rgba(139,123,255,0.75);}
.btn-ghost{background:var(--glass); color:var(--ink); border:1px solid var(--glass-b);}
.btn-ghost:hover{border-color:rgba(255,255,255,0.25);}
.btn-block{width:100%;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:520px){.row2{grid-template-columns:1fr;}}
.dropzone{border:1.5px dashed var(--glass-b); border-radius:16px; padding:36px 18px; text-align:center; color:var(--ink-dim); font-size:.92rem;}
input[type=file]{display:none;}
.hidden{display:none !important;}
.preview-img{width:100%; border-radius:14px; display:block; max-height:420px; object-fit:contain; background:#000;}
.meta{display:flex; justify-content:space-between; font-size:.82rem; color:var(--ink-dim); margin-top:10px;}
.modes{display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 22px;}
.mode-pill{border:1px solid var(--glass-b); background:var(--glass); color:var(--ink-dim); padding:9px 15px; border-radius:100px; font-size:.85rem; cursor:pointer; transition:.15s;}
.mode-pill.active{color:#0a0a12; background:linear-gradient(120deg,var(--violet),var(--cyan)); border-color:transparent; font-weight:600;}
.section-label{font-size:.78rem; text-transform:none; letter-spacing:.2px; color:var(--ink-dim); margin-bottom:10px;}
/* loader */
.loader{padding:50px 26px; text-align:center;}
.ring{width:74px;height:74px;margin:0 auto 26px; border-radius:50%; position:relative;}
.ring::before,.ring::after{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid transparent;}
.ring::before{border-top-color:var(--violet); border-right-color:var(--cyan); animation:spin 1.1s linear infinite;}
.ring::after{inset:12px; border-bottom-color:var(--amber); animation:spin 1.6s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader p{color:var(--ink-dim); font-size:.95rem; min-height:1.3em; transition:opacity .3s;}
.bar{height:4px; width:100%; max-width:280px; margin:20px auto 0; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden;}
.bar-fill{height:100%; width:0%; background:linear-gradient(90deg,var(--violet),var(--cyan)); transition:width .4s ease;}
/* slider compare */
.compare{position:relative; width:100%; border-radius:14px; overflow:hidden; user-select:none; touch-action:none; aspect-ratio:1/1; background:#000;}
.compare img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
.compare .after-wrap{position:absolute; inset:0; overflow:hidden; width:50%;}
.compare .after-wrap img{width:100%; height:100%;}
.handle{position:absolute; top:0; bottom:0; left:50%; width:0; transform:translateX(-50%); cursor:ew-resize;}
.handle::before{content:'';position:absolute; top:0; bottom:0; left:-1px; width:2px; background:rgba(255,255,255,0.85);}
.knob{position:absolute; top:50%; left:50%; width:42px; height:42px; transform:translate(-50%,-50%); border-radius:50%;
  background:rgba(10,10,15,0.75); border:1.5px solid rgba(255,255,255,0.6); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; color:#fff; font-size:.8rem;}
.tag{position:absolute; top:12px; padding:5px 11px; font-size:.72rem; border-radius:100px; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.18); letter-spacing:.3px;}
.tag.now{left:12px;} .tag.future{right:12px; background:linear-gradient(120deg,rgba(139,123,255,0.5),rgba(63,216,224,0.5));}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px;}
@media (max-width:480px){.actions{grid-template-columns:1fr;}}
.toast-wrap{position:fixed; top:calc(18px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); z-index:50; display:flex; flex-direction:column; gap:10px; width:min(380px,90vw);}
.toast{background:#15151f; border:1px solid rgba(255,90,90,0.4); color:var(--ink); padding:13px 16px; border-radius:12px; font-size:.88rem; box-shadow:0 10px 30px rgba(0,0,0,0.5); animation:in .25s ease;}
@keyframes in{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
footer{text-align:center; color:var(--ink-dim); font-size:.8rem; padding:30px 0 40px;}
.step-badge{font-size:.78rem; color:var(--ink-dim); margin-bottom:6px;}
canvas{display:none;}
video{width:100%; border-radius:14px; background:#000; display:block;}
.cam-actions{display:flex; gap:12px; margin-top:14px;}
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="wrap">
  <div class="top">
    <div class="brand"><span class="dot"></span>2030 Vision</div>
  </div>

  <div class="hero">
    <h1>See Yourself in 2030</h1>
    <p>Transform your photo into a realistic vision of your future.</p>
  </div>

  <!-- STAGE 1: ADD PHOTO -->
  <div id="stageUpload" class="panel card">
    <div class="section-label">Step 1 — Add your photo</div>
    <div class="row2">
      <button class="btn btn-primary" id="btnUpload">📤 Upload Photo</button>
      <button class="btn btn-ghost" id="btnCamera">📷 Take Photo</button>
    </div>
    <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp">
  </div>

  <!-- CAMERA -->
  <div id="stageCamera" class="panel card hidden">
    <div class="section-label">Camera</div>
    <video id="video" autoplay playsinline muted></video>
    <div class="cam-actions">
      <button class="btn btn-ghost btn-block" id="btnCancelCam">Cancel</button>
      <button class="btn btn-primary btn-block" id="btnSnap">Capture</button>
    </div>
  </div>

  <!-- STAGE 2: PREVIEW + MODE -->
  <div id="stagePreview" class="panel card hidden">
    <div class="section-label">Step 2 — Choose your future style</div>
    <img id="previewImg" class="preview-img" alt="Your photo">
    <div class="meta"><span id="metaName">—</span><span id="metaSize">—</span></div>
    <div class="modes" id="modes"></div>
    <button class="btn btn-primary btn-block" id="btnTransform">✨ Create My 2030 Look</button>
    <button class="btn btn-ghost btn-block" id="btnRetake" style="margin-top:12px;">Choose a different photo</button>
  </div>

  <!-- LOADING -->
  <div id="stageLoading" class="panel card hidden loader">
    <div class="ring"></div>
    <p id="loadMsg">Analyzing your photo…</p>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  </div>

  <!-- RESULT -->
  <div id="stageResult" class="panel card hidden">
    <div class="section-label">Your 2030 Vision</div>
    <div class="compare" id="compare">
      <img id="beforeImg" alt="Original">
      <div class="after-wrap" id="afterWrap"><img id="afterImg" alt="2030 version"></div>
      <span class="tag now">Now</span>
      <span class="tag future">2030</span>
      <div class="handle" id="handle"><div class="knob">⇔</div></div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btnDownload">⬇️ Download</button>
      <button class="btn btn-ghost" id="btnShare">🔗 Share</button>
      <button class="btn btn-ghost" id="btnRegen">🔄 Generate Again</button>
      <button class="btn btn-ghost" id="btnNew">✨ Create Another Image</button>
    </div>
  </div>

  <footer>Your photo is sent to our server to generate the 2030 version, then discarded.</footer>
</div>

<canvas id="canvas"></canvas>
<input type="file" id="cameraFallback" accept="image/*" capture="environment" class="hidden">

<script>
const $ = id => document.getElementById(id);
const stages = ['stageUpload','stageCamera','stagePreview','stageLoading','stageResult'];
function show(id){ stages.forEach(s=>$(s).classList.toggle('hidden', s!==id)); }

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  $('toastWrap').appendChild(t);
  setTimeout(()=>{t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300);},3800);
}

const MODES = [
  {id:'self', label:'👤 Future Self'},
  {id:'city', label:'🏙️ Future City'},
  {id:'fashion', label:'👔 Future Fashion'},
  {id:'sustainable', label:'🌱 Sustainable 2030'},
  {id:'lifestyle', label:'🤖 AI Lifestyle'},
];
let currentMode = 'self';
const modesEl = $('modes');
MODES.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='mode-pill'+(i===0?' active':'');
  b.textContent=m.label;
  b.onclick=()=>{ [...modesEl.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); currentMode=m.id; };
  modesEl.appendChild(b);
});

let originalDataUrl = null;
let stream = null;

// Upload
$('btnUpload').onclick = ()=> $('fileInput').click();
$('fileInput').onchange = e => handleFile(e.target.files[0]);
$('cameraFallback').onchange = e => handleFile(e.target.files[0]);

function handleFile(file){
  if(!file) return;
  const okTypes=['image/jpeg','image/jpg','image/png','image/webp'];
  if(!okTypes.includes(file.type)){ toast("That file type isn't supported. Use JPG, PNG or WEBP."); return; }
  if(file.size > 15*1024*1024){ toast('That image is too large. Please use a photo under 15MB.'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    originalDataUrl = ev.target.result;
    $('previewImg').src = originalDataUrl;
    $('metaName').textContent = file.name.length>28? file.name.slice(0,25)+'…' : file.name;
    $('metaSize').textContent = (file.size/1024/1024).toFixed(1)+' MB';
    show('stagePreview');
  };
  reader.onerror = ()=> toast("We couldn't read that photo. Please try another.");
  reader.readAsDataURL(file);
}

// Camera
$('btnCamera').onclick = async ()=>{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    $('cameraFallback').click(); return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    $('video').srcObject = stream;
    show('stageCamera');
  }catch(err){
    toast('Camera access was denied or unavailable. Choose a photo instead.');
    $('cameraFallback').click();
  }
};
function stopStream(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
$('btnCancelCam').onclick = ()=>{ stopStream(); show('stageUpload'); };
$('btnSnap').onclick = ()=>{
  const video = $('video'), canvas=$('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  originalDataUrl = canvas.toDataURL('image/jpeg',0.92);
  stopStream();
  $('previewImg').src = originalDataUrl;
  $('metaName').textContent='Camera photo';
  $('metaSize').textContent='—';
  show('stagePreview');
};

$('btnRetake').onclick = ()=> show('stageUpload');

// Transform (client-side simulated futuristic grade — see note in chat)
const LOAD_MSGS = ["Analyzing your photo…","Designing your 2030 environment…","Upgrading future technology…","Applying realistic future details…","Finalizing your 2030 vision…"];

$('btnTransform').onclick = runTransform;
$('btnRegen').onclick = runTransform;
$('btnNew').onclick = ()=>{ originalDataUrl=null; $('fileInput').value=''; show('stageUpload'); };

async function runTransform(){
  show('stageLoading');
  let i=0;
  $('loadMsg').textContent = LOAD_MSGS[0];
  $('barFill').style.width='6%';
  const msgTimer = setInterval(()=>{
    i = Math.min(i+1, LOAD_MSGS.length-1);
    $('loadMsg').style.opacity='0';
    setTimeout(()=>{ $('loadMsg').textContent = LOAD_MSGS[i]; $('loadMsg').style.opacity='1'; },250);
    $('barFill').style.width = (14 + i*20)+'%';
  }, 700);

  try{
    const resultUrl = await generateFutureVersion(originalDataUrl, currentMode);
    clearInterval(msgTimer);
    $('barFill').style.width='100%';
    setTimeout(()=>{
      $('beforeImg').src = originalDataUrl;
      $('afterImg').src = resultUrl;
      resetSlider();
      show('stageResult');
    }, 300);
  }catch(e){
    clearInterval(msgTimer);
    show('stagePreview');
    toast(e.message || "We couldn't generate your 2030 image. Please try again.");
  }
}

// Calls the real backend AI route (api/transform.js), which calls Gemini 2.5 Flash Image.
// Requires this app to be deployed with the /api/transform serverless function and a
// GEMINI_API_KEY set in the server environment — see README.md.
async function generateFutureVersion(dataUrl, mode){
  const [header, base64] = dataUrl.split(',');
  const mimeType = header.match(/data:(.*);base64/)[1];

  let res;
  try{
    res = await fetch('/api/transform', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: base64, mimeType, mode }),
    });
  }catch(networkErr){
    throw new Error("Network error — check your connection and try again.");
  }

  if(!res.ok){
    let msg = "We couldn't generate your 2030 image. Please try again.";
    if(res.status === 429) msg = "Rate limit reached. Please wait a moment and try again.";
    if(res.status === 402) msg = "Insufficient credits to generate this image.";
    try{ const body = await res.json(); if(body?.error) msg = body.error; }catch(_){}
    throw new Error(msg);
  }

  const data = await res.json();
  return `data:${data.mimeType};base64,${data.imageBase64}`;
}

// Before/after slider
let dragging=false;
function setSlider(pct){
  pct = Math.max(0,Math.min(100,pct));
  $('afterWrap').style.width = pct+'%';
  $('handle').style.left = pct+'%';
}
function resetSlider(){ setSlider(50); }
function posFromEvent(e){
  const rect = $('compare').getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return (x/rect.width)*100;
}
$('handle').addEventListener('pointerdown', ()=> dragging=true);
window.addEventListener('pointerup', ()=> dragging=false);
$('compare').addEventListener('pointermove', e=>{ if(dragging) setSlider(posFromEvent(e)); });
$('compare').addEventListener('pointerdown', e=>{ dragging=true; setSlider(posFromEvent(e)); });

// Result actions
$('btnDownload').onclick = ()=>{
  const a = document.createElement('a');
  a.href = $('afterImg').src;
  a.download = 'future-2030.jpg';
  a.click();
};
$('btnShare').onclick = async ()=>{
  try{
    if(navigator.share){
      const blob = await (await fetch($('afterImg').src)).blob();
      const file = new File([blob],'future-2030.jpg',{type:'image/jpeg'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'My 2030 Vision'});
        return;
      }
    }
    toast('Sharing is not supported on this device. Try Download instead.');
  }catch(e){ /* user cancelled share — no toast needed */ }
};
</script>
</body>
</html>
